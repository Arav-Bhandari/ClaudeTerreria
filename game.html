const ZONES=['Forest','Caves','Stone Depths','Deep Slate','The Abyss','Desert','Tundra'];
const BIO=new Uint8Array(W); // surface biome per column: 0 forest, 1 desert, 2 tundra
const zoneOf=(x,y)=>{const c=clamp(x|0,0,W-1);return y<hs[c]+6?(BIO[c]?4+BIO[c]:0):y<110?1:y<165?2:y<205?3:4};

// ===================== 2. utils =====================
const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hh=(x,y)=>((x*73856093)^(y*19349663))>>>0;
function clamp(v,a,b){return v<a?a:v>b?b:v}
const lerp=(a,b,t)=>a+(b-a)*t,approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
// critically damped spring (damping 1.0, response ~0.3s): used for every UI motion and camera feel
function spring(s,target,dt,resp=.3){const w=6.2832/resp,d=s.x-target,e=Math.exp(-w*dt);s.x=target+(d+(s.v+w*d)*dt)*e;s.v=(s.v-w*(s.v+w*d)*dt)*e}
const mkSpring=(x=0)=>({x,v:0});

// ===================== 3. world =====================
const T=new Uint8Array(W*H),hs=new Int16Array(W),seen=new Uint8Array(W*H),BGW=new Uint8Array(W*H); // BGW: player-built background walls
const tile=(x,y)=>x<0||x>=W||y>=H?STONE:y<0?AIR:T[y*W+x];
const solid=(x,y)=>SOLID[tile(x,y)];
let seed=1,changes=new Map(),chests=new Map(); // chests: tile index -> 18 slots (generated chests fill lazily on first open)
const lights=new Set(),fallers=[]; // indices of torches/furnaces; falling sand blocks
function setTile(x,y,v){
  if(x<0||x>=W||y<0||y>=H)return;
  const i=y*W+x,o=T[i];T[i]=v;changes.set(i,v);
  if(o===TORCH||o===FURN)lights.delete(i);
  if(v===TORCH||v===FURN)lights.add(i);
  mapTile(x,y);
  if(!SOLID[v])sandCheck(x,y-1);
}
function sandCheck(x,y){ // unsupported sand turns into a falling block (setTile recurses up the column)
  if(tile(x,y)!==SAND||SOLID[tile(x,y+1)]||tile(x,y+1)===PLAT)return;
  fallers.push({x,y,vy:0});setTile(x,y,AIR);
}
function chestOf(i){if(!chests.has(i)){const a=Array(18).fill(null);lootFor(i%W,i/W|0).forEach(([id,n],k)=>a[k]={id,n});chests.set(i,a)}return chests.get(i)}
function lootFor(x,y){ // deterministic loot per chest position
  const r=mulberry32(hh(x,y)),deep=y>165,L=[[TORCH,3+r()*6|0],[24,8+r()*18|0]];
  if(r()<.5)L.push([25,1+(r()*2|0)]);
  L.push(deep?[20,2+r()*3|0]:[19,2+r()*3|0]);
  if(r()<(deep?.55:.2))L.push([26,1]);
  if(deep&&r()<.5)L.push([21,1+(r()*2|0)]);
  if(r()<.25)L.push([deep?TOOLID(KB,4):TOOLID(KB,2),1]);
  if(r()<.3)L.push([ARMID(deep?3:2,r()*3|0),1]);
  const b=BIO[x];if(!deep&&b===1&&r()<.75)L.push([73,1]);else if(!deep&&b===2&&r()<.75)L.push([74,1]);else if(!deep&&!b&&r()<.25)L.push([75,1]);
  return L;
}
function gen(sd){
  const r=mulberry32(sd),lat=()=>Array.from({length:128},r),A=lat(),B=lat(),C=lat();
  const sm=(a,x)=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return a[i&127]*(1-u)+a[(i+1)&127]*u};
  T.fill(0);BGW.fill(0);
  const slateY=x=>168+sm(A,x/18+7)*14,flip=r()<.5,dC=flip?W*.8:W*.2,sC=flip?W*.2:W*.8;
  for(let x=0;x<W;x++){
    BIO[x]=Math.abs(x-dC)<55+sm(C,x/9)*10?1:Math.abs(x-sC)<55+sm(C,x/9+30)*10?2:0;
    let h=SURF+(sm(A,x/40)-.5)*22+(sm(B,x/14)-.5)*(BIO[x]===1?3:7)+(sm(C,x/5)-.5)*2; // dunes are smoother
    const k=Math.max(0,1-Math.abs(x-W/2)/30);h=h*(1-k*k)+SURF*k*k; // flat spawn plateau
    h=hs[x]=Math.round(h);
    const dd0=4+Math.floor(sm(B,x/6+50)*4),sl=slateY(x),b=BIO[x];
    for(let y=h;y<H;y++)T[y*W+x]=y>sl?SLATE:b===1?(y-h<dd0+9?SAND:y<105?SSTONE:STONE):b===2?(y-h<dd0+2?SNOW:STONE):y===h?GRASS:y-h<dd0?DIRT:STONE;
  }
  const put=(x,y,id,over)=>{if(x>1&&x<W-2&&y>1&&y<H-2&&over.includes(T[y*W+x]))T[y*W+x]=id};
  const blob=(x,y,id,n,over)=>{for(let i=0;i<n;i++){put(x,y,id,over);x+=Math.floor(r()*3)-1;y+=Math.floor(r()*3)-1}};
  for(let i=0;i<60;i++)blob(r()*W|0,SURF+8+r()*100|0,DIRT,40,[STONE]);
  const SS=[STONE,SLATE];
  const K=W/400; // ore counts scale with world width
  for(let i=0;i<190*K;i++)blob(r()*W|0,SURF+8+r()*85|0,COPPER,6+r()*6|0,[STONE,DIRT,SSTONE]);
  for(let i=0;i<140*K;i++)blob(r()*W|0,100+r()*100|0,IRON,6+r()*5|0,SS);
  for(let i=0;i<110*K;i++)blob(r()*W|0,140+r()*85|0,GOLD,5+r()*5|0,SS);
  for(let i=0;i<90*K;i++)blob(r()*W|0,185+r()*50|0,AZUR,5+r()*4|0,SS);
  for(let i=0;i<60;i++){const x=r()*W|0;if(BIO[x]===2)blob(x,hs[x]+6+r()*40|0,ICE,20+r()*20|0,[STONE,SNOW])}
  const carve=(cx,cy,rad)=>{const R=Math.ceil(rad);for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const x=Math.round(cx+dx),y=Math.round(cy+dy);if(dx*dx+dy*dy<=rad*rad&&x>1&&x<W-2&&y>1&&y<H-3)T[y*W+x]=AIR}};
  const worm=(x,y,a,len,rad,surf)=>{for(let i=0;i<len;i++){x+=Math.cos(a);y+=Math.sin(a);a+=(r()-.5)*.8;
    const xi=clamp(x|0,0,W-1);
    if(!(surf&&i<14)&&y<hs[xi]+8&&Math.sin(a)<0)a=-a;
    if(y>H-8&&Math.sin(a)>0)a=-a;
    if(x<5||x>W-5)a=Math.PI-a;
    carve(x,y,rad*(.7+r()*.6))}};
  for(let i=0;i<16*K;i++){const x=r()*W|0;if(Math.abs(x-W/2)>28)worm(x,hs[x],Math.PI/2+(r()-.5),90,1.6,true)}
  for(let i=0;i<85*K;i++)worm(r()*W,SURF+15+r()*(H-SURF-25),r()*6.28,60+r()*90,1.2+r()*1.2,false);
  for(let i=0;i<20*K;i++)worm(r()*W,SURF+30+r()*(H-SURF-45),0,5,4+r()*2,false);
  // ruins: planks in the caves, slate vaults in the deep
  const room=(x,y,w,h,wall,nch)=>{
    if(x<3||x+w>W-3||y+h>H-3)return;
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){const e=i===0||j===0||i===w-1||j===h-1;T[(y+j)*W+x+i]=e&&(j===h-1||r()>.14)?wall:AIR}
    for(let k=0;k<2;k++){T[(y+h-3+k)*W+x]=AIR;T[(y+h-3+k)*W+x+w-1]=AIR}
    T[(y+2)*W+x+1]=TORCH;T[(y+2)*W+x+w-2]=TORCH;
    for(let i=2;i<w-2;i++)if(r()<.5)T[(y+3)*W+x+i]=PLAT;
    for(let c=0;c<nch;c++)T[(y+h-2)*W+x+2+(r()*(w-5)|0)]=CHEST;
  };
  for(let i=0;i<14*K;i++)room(10+r()*(W-40)|0,92+r()*60|0,11+r()*5|0,7,PLANK,1);
  for(const c of[dC,sC])for(let k=0;k<3;k++)room(c-40+r()*70|0,82+r()*40|0,11+r()*4|0,7,c===dC?SSTONE:ICE,1); // biome ruins
  for(let i=0;i<9*K;i++)room(10+r()*(W-40)|0,172+r()*55|0,13+r()*4|0,8,SLATE,2);
  // trees (cacti in the desert, taller pines in the tundra)
  for(let x=4;x<W-4;x+=3+(r()*7|0)){
    if(Math.abs(x-W/2)<2)continue;const y=hs[x],top=T[y*W+x];
    if(top===SAND&&!T[(y-1)*W+x]&&r()<.6){const h=3+(r()*3|0);for(let i=1;i<=h;i++)T[(y-i)*W+x]=CACTUS;
      for(const sd of[-1,1])if(r()<.6){const ay=y-2-(r()*(h-2)|0);if(!T[ay*W+x+sd]&&!T[(ay-1)*W+x+sd]){T[ay*W+x+sd]=CACTUS;T[(ay-1)*W+x+sd]=CACTUS}}
      x+=3;continue}
    if(top!==GRASS&&top!==SNOW||T[(y-1)*W+x])continue;
    const h=4+(r()*5|0)+(top===SNOW?2:0);
    for(let i=1;i<=h;i++)T[(y-i)*W+x]=LOG;
    for(let dy=-2;dy<=1;dy++)for(let dx=-2;dx<=2;dx++){const tx=x+dx,ty=y-h+dy;
      if(dx*dx+dy*dy<=5&&T[ty*W+tx]===AIR)T[ty*W+tx]=LEAF}
  }
}

  if(sv){sv.inv.forEach((s,i)=>{inv[i]=s});Object.assign(P,{x:sv.x,y:sv.y,hp:sv.hp,mhp:sv.mhp,arm:sv.arm,acc:sv.acc,bed:sv.bed,boss1:sv.boss1,won:sv.won});sel=sv.sel;time=sv.time}
  else{inv[0]={id:TOOLID(KP,0),n:1};inv[1]={id:TOOLID(KA,0),n:1};inv[2]={id:TOOLID(KS,0),n:1};inv[3]={id:11,n:6}}
  unstick();snapCam();revealMap();lastZone=-1;
}
function resetSave(){try{localStorage.removeItem(KEY)}catch(e){}newGame((Math.random()*2e9)|0||1,null);invOpen=false;toast('A new world awaits',GOLD3)}

// ===================== 19. main step =====================
function step(dt){
  dt=Math.min(dt,1/30);
  if(hitstop>0){hitstop-=dt;dt*=.1}
  tAbs+=dt;time=(time+dt/DAY)%1;
  let dir=0;
  if(P.dead>0){P.dead-=dt;P.vx=approach(P.vx,0,20*dt);if(P.dead<=0)respawn()}
  else dir=playerStep(dt);
  playerAct(dt,dir);
  mouse.rEdge=false;
  dropsStep(dt);fallStep(dt);stepEnemies(dt);projStep(dt);partsStep(dt);ambStep(dt,daylight());
  // camera: springs give soft follow + look-ahead rubber band
  const vw=BW/TS,vh=BH/TS;
  spring(cam.look,clamp(P.vx*.16,-2,2)*(RM?0:1),dt,.5);
  spring(cam.sx,P.x+P.w/2-vw/2+cam.look.x,dt,.26);spring(cam.sy,P.y+P.h/2-vh/2+(P.vy>14?1.5:0),dt,.3);
  cam.x=clamp(cam.sx.x,0,W-vw);cam.y=clamp(cam.sy.x,0,H-vh);
  if(cam.x!==cam.sx.x){cam.sx.x=cam.x;cam.sx.v=0}if(cam.y!==cam.sy.x){cam.sy.x=cam.y;cam.sy.v=0}
  spring(shk.x,0,dt,.2);spring(shk.y,0,dt,.2);
  if(((tAbs*5)|0)!==(((tAbs-dt)*5)|0))revealMap();
  saveT-=dt;if(saveT<=0){saveT=6;save()}
}

// ===================== 20. input =====================
function setM(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.moved=true}
addEventListener('mousemove',setM);
addEventListener('mousedown',e=>{
  setM(e);audio();craftFocus=false; // the search box re-focuses itself through its hit handler
  if(showTitle){showTitle=false;return}
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(over(h.x,h.y,h.w,h.h)){pressedId=h.id;mouse.ui=true;h.fn(e.button);return}}
  if(invOpen&&carry>=0){throwSlot(carry);carry=-1;mouse.ui=true;return}
  if(paused)return;
  if(e.button===0)mouse.l=true;
  if(e.button===2){mouse.r=true;mouse.rEdge=true}
});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=false;if(e.button===2)mouse.r=false;mouse.ui=false;pressedId=''});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{
  e.preventDefault();const d=Math.sign(e.deltaY);if(!d||showTitle)return;
  if(invOpen&&CR&&over(CR.x,CR.y,CR.w,CR.h))craftScroll+=d;else{sel=(sel+d+9)%9;snd.ui()}
},{passive:false});
addEventListener('keydown',e=>{
  audio();
  if(showTitle){showTitle=false;e.preventDefault();return}
  if(craftFocus&&invOpen){ // typing into the crafting search box: swallow game keys
    e.preventDefault();if(e.key==='Escape'||e.key==='Enter')craftFocus=false;else if(e.key==='Backspace')craftQ=craftQ.slice(0,-1);
    else if(e.key.length===1&&GL[e.key]&&craftQ.length<18)craftQ+=e.key;craftScroll=0;return}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if((e.code==='Space'||e.code==='KeyW'||e.code==='ArrowUp')&&!e.repeat)P.buf=.12;
  if(e.repeat)return;
  if(/^Digit[1-9]$/.test(e.code)){sel=+e.code[5]-1;snd.ui()}
  else if(e.code==='KeyE'){invOpen=!invOpen;carry=-1;snd.ui()}
  else if(e.code==='Escape'||e.code==='KeyP'){if(invOpen&&e.code==='Escape'){invOpen=false;carry=-1}else paused=!paused}
  else if(e.code==='KeyQ'&&!paused){throwSlot(sel)}
  else if(e.code==='KeyF'&&!paused){fireHook()}
  else if(e.code==='KeyM'){mapOn=(mapOn+1)%3;snd.ui()} // off -> minimap -> full map
  else if(e.code==='KeyN'){if(!muted&&musicOn){musicOn=false;toast('Music off')}else if(!muted){muted=true;toast('All sound off')}else{muted=false;musicOn=true;toast('Sound on')}}
  else if(e.code==='KeyH')showTitle=true;
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.l=mouse.r=false});
addEventListener('beforeunload',save);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('resize',resize);

// ===================== 21. boot =====================
function prewarm(){ // build every character frame up front so the first enemy / first step never hitches
  for(let i=0;i<WN;i++){playerSpr('walk',i);human('z'+i,ZO,ZP[i]);human('zf'+i,ZO2,ZP[i]);human('k'+i,SO,SP[i]);human('b'+i,BO,BP[i])}
  playerSpr('idle',0);playerSpr('idle',1);['jump','fall','skid'].forEach(n=>playerSpr(n));
  for(let v=0;v<3;v++)for(let h=7;h<=17;h++)for(let ed=-1;ed<=1;ed++)slimeSpr(v,h,ed);
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(let f=0;f<2;f++){eyeSpr(a,b,f);eyeSpr(a,b,f,1)}
  for(let f=0;f<4;f++){batSpr(f);batSpr(f,1)}
  for(let k=0;k<3;k++)wyrmSpr(k);
  for(let v=3;v<5;v++)for(let h=7;h<=17;h++)for(let ed=-1;ed<=1;ed++)slimeSpr(v,h,ed);
}
prewarm();
let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(Math.max((now-lastT)/1000,0),1/30);lastT=now;
  if(!showTitle&&!paused)step(dt);else tAbs+=dt;
  if(!paused)musicStep();
  draw();drawUI(dt);
}
resize();
const boot=loadSave();newGame(boot?boot.seed:(Math.random()*2e9)|0||1,boot);
requestAnimationFrame(t=>{lastT=t;frame(t)});
</script>
