const zoneOf=(x,y)=>y<hs[clamp(x|0,0,W-1)]+6?0:y<110?1:y<165?2:y<205?3:4;

// ===================== 2. utils =====================
const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hh=(x,y)=>((x*73856093)^(y*19349663))>>>0;
function clamp(v,a,b){return v<a?a:v>b?b:v}
const lerp=(a,b,t)=>a+(b-a)*t,approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
// critically damped spring (damping 1.0, response ~0.3s): used for every UI motion and camera feel
function spring(s,target,dt,resp=.3){const w=6.2832/resp,d=s.x-target,e=Math.exp(-w*dt);s.x=target+(d+(s.v+w*d)*dt)*e;s.v=(s.v-w*(s.v+w*d)*dt)*e}
const mkSpring=(x=0)=>({x,v:0});

// ===================== 3. world =====================
const T=new Uint8Array(W*H),hs=new Int16Array(W),seen=new Uint8Array(W*H);
const tile=(x,y)=>x<0||x>=W||y>=H?STONE:y<0?AIR:T[y*W+x];
const solid=(x,y)=>SOLID[tile(x,y)];
let seed=1,changes=new Map();
const lights=new Set(); // indices of torches/furnaces
function setTile(x,y,v){
  if(x<0||x>=W||y<0||y>=H)return;
  const i=y*W+x,o=T[i];T[i]=v;changes.set(i,v);
  if(o===TORCH||o===FURN)lights.delete(i);
  if(v===TORCH||v===FURN)lights.add(i);
  mapTile(x,y);
}
function lootFor(x,y){ // deterministic loot per chest position
  const r=mulberry32(hh(x,y)),deep=y>165,L=[[TORCH,3+r()*6|0],[24,8+r()*18|0]];
  if(r()<.5)L.push([25,1+(r()*2|0)]);
  L.push(deep?[20,2+r()*3|0]:[19,2+r()*3|0]);
  if(r()<(deep?.55:.2))L.push([26,1]);
  if(deep&&r()<.5)L.push([21,1+(r()*2|0)]);
  if(r()<.25)L.push([deep?TOOLID(KB,4):TOOLID(KB,2),1]);
  return L;
}
function gen(sd){
  const r=mulberry32(sd),lat=()=>Array.from({length:128},r),A=lat(),B=lat(),C=lat();
  const sm=(a,x)=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return a[i&127]*(1-u)+a[(i+1)&127]*u};
  T.fill(0);
  const slateY=x=>168+sm(A,x/18+7)*14;
  for(let x=0;x<W;x++){
    let h=SURF+(sm(A,x/40)-.5)*22+(sm(B,x/14)-.5)*7+(sm(C,x/5)-.5)*2;
    const k=Math.max(0,1-Math.abs(x-W/2)/30);h=h*(1-k*k)+SURF*k*k; // flat spawn plateau
    h=hs[x]=Math.round(h);
    const dd0=4+Math.floor(sm(B,x/6+50)*4),sl=slateY(x);
    for(let y=h;y<H;y++)T[y*W+x]=y===h?GRASS:y-h<dd0?DIRT:y>sl?SLATE:STONE;
  }
  const put=(x,y,id,over)=>{if(x>1&&x<W-2&&y>1&&y<H-2&&over.includes(T[y*W+x]))T[y*W+x]=id};
  const blob=(x,y,id,n,over)=>{for(let i=0;i<n;i++){put(x,y,id,over);x+=Math.floor(r()*3)-1;y+=Math.floor(r()*3)-1}};
  for(let i=0;i<60;i++)blob(r()*W|0,SURF+8+r()*100|0,DIRT,40,[STONE]);
  const SS=[STONE,SLATE];
  for(let i=0;i<190;i++)blob(r()*W|0,SURF+8+r()*85|0,COPPER,6+r()*6|0,[STONE,DIRT]);
  for(let i=0;i<140;i++)blob(r()*W|0,100+r()*100|0,IRON,6+r()*5|0,SS);
  for(let i=0;i<110;i++)blob(r()*W|0,140+r()*85|0,GOLD,5+r()*5|0,SS);
  for(let i=0;i<90;i++)blob(r()*W|0,185+r()*50|0,AZUR,5+r()*4|0,SS);
  const carve=(cx,cy,rad)=>{const R=Math.ceil(rad);for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const x=Math.round(cx+dx),y=Math.round(cy+dy);if(dx*dx+dy*dy<=rad*rad&&x>1&&x<W-2&&y>1&&y<H-3)T[y*W+x]=AIR}};
  const worm=(x,y,a,len,rad,surf)=>{for(let i=0;i<len;i++){x+=Math.cos(a);y+=Math.sin(a);a+=(r()-.5)*.8;
    const xi=clamp(x|0,0,W-1);
    if(!(surf&&i<14)&&y<hs[xi]+8&&Math.sin(a)<0)a=-a;
    if(y>H-8&&Math.sin(a)>0)a=-a;
    if(x<5||x>W-5)a=Math.PI-a;
    carve(x,y,rad*(.7+r()*.6))}};
  for(let i=0;i<16;i++){const x=r()*W|0;if(Math.abs(x-W/2)>28)worm(x,hs[x],Math.PI/2+(r()-.5),90,1.6,true)}
  for(let i=0;i<85;i++)worm(r()*W,SURF+15+r()*(H-SURF-25),r()*6.28,60+r()*90,1.2+r()*1.2,false);
  for(let i=0;i<20;i++)worm(r()*W,SURF+30+r()*(H-SURF-45),0,5,4+r()*2,false);
  // ruins: planks in the caves, slate vaults in the deep
  const room=(x,y,w,h,wall,nch)=>{
    if(x<3||x+w>W-3||y+h>H-3)return;
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){const e=i===0||j===0||i===w-1||j===h-1;T[(y+j)*W+x+i]=e&&(j===h-1||r()>.14)?wall:AIR}
    for(let k=0;k<2;k++){T[(y+h-3+k)*W+x]=AIR;T[(y+h-3+k)*W+x+w-1]=AIR}
    T[(y+2)*W+x+1]=TORCH;T[(y+2)*W+x+w-2]=TORCH;
    for(let i=2;i<w-2;i++)if(r()<.5)T[(y+3)*W+x+i]=PLAT;
    for(let c=0;c<nch;c++)T[(y+h-2)*W+x+2+(r()*(w-5)|0)]=CHEST;
  };
  for(let i=0;i<14;i++)room(10+r()*(W-40)|0,92+r()*60|0,11+r()*5|0,7,PLANK,1);
  for(let i=0;i<9;i++)room(10+r()*(W-40)|0,172+r()*55|0,13+r()*4|0,8,SLATE,2);
  // trees
  for(let x=4;x<W-4;x+=3+(r()*7|0)){
    if(Math.abs(x-W/2)<2)continue;const y=hs[x];
    if(T[y*W+x]!==GRASS||T[(y-1)*W+x])continue;
    const h=4+(r()*5|0);
    for(let i=1;i<=h;i++)T[(y-i)*W+x]=LOG;
    for(let dy=-2;dy<=1;dy++)for(let dx=-2;dx<=2;dx++){const tx=x+dx,ty=y-h+dy;
      if(dx*dx+dy*dy<=5&&T[ty*W+tx]===AIR)T[ty*W+tx]=LEAF}
  }
}

  const s=AC.createBufferSource(),gn=AC.createGain(),t=AC.currentTime;s.buffer=NB;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);

  step:()=>noise(.04,.025,900),land:()=>noise(.08,.05,700),chest:()=>{tone(300,600,.15,'triangle',.08);setTimeout(()=>tone(600,900,.15,'triangle',.08),90)},

// ===================== 9. inventory =====================
function addItem(id,n=1){
  for(let i=0;i<36&&n;i++){const s=inv[i];if(s&&s.id===id&&s.n<999){const a=Math.min(n,999-s.n);s.n+=a;n-=a;POP[i].x=.3}}
  for(let i=0;i<36&&n;i++)if(!inv[i]){const a=Math.min(n,999);inv[i]={id,n:a};n-=a;POP[i].x=.3}
  return n;
}
const count=id=>inv.reduce((a,s)=>a+(s&&s.id===id?s.n:0),0);
function take(id,n){for(let i=35;i>=0&&n>0;i--){const s=inv[i];if(s&&s.id===id){const a=Math.min(n,s.n);s.n-=a;n-=a;POP[i].x=-.25;if(!s.n)inv[i]=null}}}
function nearStation(st){ // workbench / furnace within a few tiles
  if(!st)return true;const cx=P.x+P.w/2|0,cy=P.y+P.h/2|0,want=st===1?BENCH:FURN;
  for(let j=-3;j<=3;j++)for(let i=-5;i<=5;i++)if(tile(cx+i,cy+j)===want)return true;return false;
}
const canCraft=r=>r.need.every(([id,n])=>count(id)>=n)&&nearStation(r.st);
function craft(r){
  if(!canCraft(r)){snd.no();return false}
  r.need.forEach(([id,n])=>take(id,n));
  const left=addItem(r.out,r.n);if(left)drop(r.out,P.x+P.w/2,P.y,left);
  snd.craft();return true;
}

// ===================== 10. physics =====================
const hit=(x,y,w,h)=>{for(let j=Math.floor(y);j<=Math.floor(y+h-1e-4);j++)for(let i=Math.floor(x);i<=Math.floor(x+w-1e-4);i++)if(solid(i,j))return true;return false};
function move(b,dt){
  const n=Math.ceil(Math.max(Math.abs(b.vx),Math.abs(b.vy))*dt/.4)||1;let sx=b.vx*dt/n,sy=b.vy*dt/n;
  const wasG=b.ground;b.hx=0;b.ground=false;
  for(let i=0;i<n;i++){
    if(sx){
      if(!hit(b.x+sx,b.y,b.w,b.h))b.x+=sx;
      else if(b.step&&wasG&&b.vy>=0&&!hit(b.x+sx,b.y-1,b.w,b.h)&&!hit(b.x,b.y-1,b.w,b.h)){b.x+=sx;b.y-=1;if(b.oy!==undefined)b.oy+=1} // auto step-up one tile
      else{b.hx=Math.sign(sx);b.vx=0;sx=0}
    }
    if(sy){
      let landed=false;
      if(sy>0&&!b.drop){const f0=b.y+b.h,f1=f0+sy,ry=Math.floor(f1);
        if(f0<=ry+1e-3&&f1>ry)for(let k=Math.floor(b.x);k<=Math.floor(b.x+b.w-1e-4);k++)if(tile(k,ry)===PLAT){b.y=ry-b.h;b.ground=true;b.vy=0;sy=0;landed=true;break}}
      if(!landed){
        if(!hit(b.x,b.y+sy,b.w,b.h))b.y+=sy;
        else{if(sy>0){b.y=Math.floor(b.y+sy+b.h)-b.h;b.ground=true}else b.y=Math.floor(b.y+sy)+1;b.vy=0;sy=0}
      }
    }
  }
}
const overlap=(a,tx,ty)=>a.x<tx+1&&a.x+a.w>tx&&a.y<ty+1&&a.y+a.h>ty;

// ===================== 11. particles, floats, drops, projectiles =====================
// particles are single square pixels: x,y in tile units
function burst(x,y,col,n,spd=4,life=.6,g2=14){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.3+Math.random());
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*.4,t:0,life:life*(.6+Math.random()*.8),col,sz:Math.random()<.3?2:1,g:g2})}
  if(parts.length>600)parts.splice(0,150);
}
const floatText=(x,y,s,c=WHITE)=>floats.push({x,y,t:0,s,c});
function drop(id,x,y,n=1,vx=(Math.random()-.5)*4){drops.push({id,n,x:x-.2,y:y-.2,w:.4,h:.4,vx,vy:-5,t:0,ground:false})}
function dropsStep(dt){
  const px=P.x+P.w/2,py=P.y+P.h/2;
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.t+=dt;
    const dx=px-(d.x+.2),dy=py-(d.y+.2),dist=Math.hypot(dx,dy)||.01;
    if(P.dead<=0&&d.t>.45&&dist<3.2){ // magnet: accelerate toward the player
      d.mag=(d.mag||0)+dt;const sp=(5+d.mag*30)*dt;d.x+=dx/dist*Math.min(sp,dist);d.y+=dy/dist*Math.min(sp,dist);
    }else{d.mag=0;d.vy=Math.min(d.vy+30*dt,20);move(d,dt);if(d.ground)d.vx=approach(d.vx,0,12*dt)}
    if(P.dead<=0&&dist<.55&&d.t>.2){
      if(d.id===27){P.hp=Math.min(P.mhp,P.hp+20);floatText(px,P.y,'+20',RAMP.grass[3]);snd.heal();drops.splice(i,1);continue}
      const left=addItem(d.id,d.n);
      if(left<d.n){snd.pick();floatText(px,P.y-.3,'+'+(d.n-left)+' '+IT[d.id].name,WHITE)}
      if(!left){drops.splice(i,1);continue}d.n=left;
    }
    if(d.t>300)drops.splice(i,1);
  }
}
function partsStep(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;f.y-=1.6*dt*(1-f.t);if(f.t>1)floats.splice(i,1)}
}
function shoot(x,y,vx,vy,dmg,friendly,kind){proj.push({x,y,vx,vy,dmg,f:friendly,kind,t:0,rot:0})}
function projStep(dt){
  for(let i=proj.length-1;i>=0;i--){const p=proj[i];p.t+=dt;let dead=p.t>6;
    for(let s=0;s<2&&!dead;s++){
      p.vy+=(p.kind==='arrow'?7:24)*dt/2;p.x+=p.vx*dt/2;p.y+=p.vy*dt/2;p.rot+=dt*14;
      if(solid(Math.floor(p.x),Math.floor(p.y))){dead=true;burst(p.x,p.y,RAMP.wood[3],4,2,.3)}
      else if(p.f){for(const e of enemies)if(p.x>e.x&&p.x<e.x+e.w&&p.y>e.y&&p.y<e.y+e.h){hurtEnemy(e,p.dmg,Math.sign(p.vx),.7);dead=true;break}}
      else if(P.dead<=0&&p.x>P.x&&p.x<P.x+P.w&&p.y>P.y&&p.y<P.y+P.h){hurtPlayer(p.dmg,Math.sign(p.vx));dead=true}
    }
    if(dead)proj.splice(i,1);
  }
}

// ===================== 12. player =====================
function respawn(){Object.assign(P,{x:P.spawnX,y:P.spawnY,vx:0,vy:0,hp:P.mhp,dead:0,inv:2,swing:0,oy:0});unstick();snapCam()}
function die(){P.dead=3;P.hp=0;snd.die();kick(12);burst(P.x+P.w/2,P.y+P.h/2,'#d83a4a',30,7,1)}
function hurtPlayer(d,dir){
  if(P.inv>0||P.dead>0)return;
  P.hp-=d;P.inv=.9;P.vx=dir*8;P.vy=-7;P.regen=0;P.hurtT=.25;kick(5);hitstop=Math.max(hitstop,.06);snd.hurt();
  burst(P.x+P.w/2,P.y+P.h/2,'#d83a4a',10,5,.5);floatText(P.x+P.w/2,P.y-.2,'-'+Math.round(d),'#ff8a8e');
  if(P.hp<=0)die();
}
function unstick(){let n=0;while(hit(P.x,P.y,P.w,P.h)&&n++<300)P.y-=1}
function snapCam(){const vw=BW/TS,vh=BH/TS;cam.sx.x=cam.x=clamp(P.x+P.w/2-vw/2,0,W-vw);cam.sy.x=cam.y=clamp(P.y+P.h/2-vh/2,0,H-vh);cam.sx.v=cam.sy.v=0}
function playerStep(dt){
  const L=keys.KeyA||keys.ArrowLeft,Rr=keys.KeyD||keys.ArrowRight,dir=(Rr?1:0)-(L?1:0),held=keys.Space||keys.KeyW||keys.ArrowUp;
  P.drop=!!(keys.KeyS||keys.ArrowDown);
  const tgt=dir*8.5,skidding=dir&&P.vx*dir<-3&&P.ground;
  const a=dir?(P.ground?68:36)*(P.vx*dir<0?1.9:1):(P.ground?58:8);
  P.vx=approach(P.vx,tgt,a*dt);
  P.skid=skidding?.12:Math.max(0,P.skid-dt);
  P.coy=P.ground?.1:P.coy-dt;P.buf-=dt;
  if(P.buf>0&&P.coy>0){P.vy=-21;P.coy=0;P.buf=0;P.sq.x=.2;snd.jump();burst(P.x+P.w/2,P.y+P.h,PART_COL[tile(P.x+P.w/2|0,P.y+P.h|0)]||RAMP.dirt[2],5,2.5,.35)}
  P.vy=Math.min(P.vy+54*dt*(P.vy<0&&!held?2.6:P.vy>0?1.2:1),34);
  const g0=P.ground,vy0=P.vy;P.lastVy=vy0;
  move(P,dt);P.oy*=Math.exp(-16*dt);
  if(P.ground&&!g0&&vy0>9){P.sq.x=-Math.min(.34,vy0/70);snd.land();burst(P.x+P.w/2,P.y+P.h,PART_COL[tile(P.x+P.w/2|0,(P.y+P.h|0))]||RAMP.dirt[2],Math.min(10,vy0/3|0),3,.4);if(vy0>26)kick(4)}
  spring(P.sq,0,dt,.22);
  // walk cycle: frame chosen by distance travelled so feet do not slide
  const sp=Math.abs(P.vx);
  if(P.ground&&sp>.4){P.dist+=sp*dt;const fr=Math.round(P.dist/CYC.p*WN)%WN;
    if(fr!==P.lastFr&&(fr===0||fr===WN/2)&&sp>1.5){snd.step();burst(P.x+P.w/2-P.face*.1,P.y+P.h,PART_COL[tile(P.x+P.w/2|0,(P.y+P.h|0))]||RAMP.dirt[2],sp>6?2:1,1.5,.3,8)}
    P.fr=fr;P.lastFr=fr;P.idleT=0}
  else{P.idleT+=dt;if(P.ground)P.fr=0}
  if(P.skid>0&&Math.random()<.5)burst(P.x+P.w/2,P.y+P.h,RAMP.dirt[3],1,2,.3,6);
  P.turn=Math.max(0,P.turn-dt);P.inv=Math.max(0,P.inv-dt);P.hurtT=Math.max(0,P.hurtT-dt);
  P.regen+=dt;
  if(P.regen>3&&P.hp<P.mhp)P.hp=Math.min(P.mhp,P.hp+(1.5+(P.ground&&sp<.5?4:0))*dt);
  return dir;
}
const REACHF=(tx,ty)=>Math.hypot(tx+.5-(P.x+P.w/2),ty+.5-(P.y+P.h/2))<=REACH;
function breakTile(x,y){
  const t=tile(x,y);
  if(t===LOG){let yy=y;while(tile(x,yy)===LOG){setTile(x,yy,AIR);drop(6,x+.5,yy+.5);burst(x+.5,yy+.5,PART_COL[LOG],6,4,.5);yy--}
    for(let j=yy-2;j<=yy+2;j++)for(let i=x-3;i<=x+3;i++)if(tile(i,j)===LEAF&&Math.hypot(i-x,j-yy)<3.3){setTile(i,j,AIR);if(Math.random()<.35)burst(i+.5,j+.5,PART_COL[LEAF],3,2,.6)}
  }else{
    if(t===CHEST)spillChest(x,y);
    setTile(x,y,AIR);if(DROP[t])drop(DROP[t],x+.5,y+.5);
    burst(x+.5,y+.5,PART_COL[t]||'#fff',12,5,.6);
  }
  snd.brk();kick(t>=SLATE||t===GOLD?2:1.2);
}
function spillChest(x,y){lootFor(x,y).forEach(([id,n],k)=>drop(id,x+.5,y+.3,n,(k-2)*1.4));snd.chest();toast('Chest opened!',RAMP.gold[3]);burst(x+.5,y+.5,RAMP.gold[3],14,5,.7)}
function hurtEnemy(e,d,dir,kb=1){
  e.hp-=d;e.flash=.12;const kr=1-(ET[e.t].kbr||0);e.stun=.22*kr;e.vx=dir*7*kb*kr;e.vy=(e.fly?-2:-5)*kr;
  floatText(e.x+e.w/2,e.y-.2,Math.round(d),d>=20?RAMP.gold[3]:WHITE);burst(e.x+e.w/2,e.y+e.h/2,ET[e.t].blood,7,4,.45);
  snd.hit();kick(d>=12?3:1.5);hitstop=Math.max(hitstop,d>=12?.05:.025);
  if(e.hp<=0){hitstop=Math.max(hitstop,.08);killEnemy(e)}
}
function tryPlace(it,tx,ty){
  const t=it.tile;
  const bad=()=>{flash.x=tx;flash.y=ty;flash.t=.3;snd.no();return false};
  if(!REACHF(tx,ty)||tile(tx,ty)!==AIR||ty<1||ty>=H-1)return bad();
  const nb=[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const n=tile(tx+a,ty+b);return n!==AIR&&n!==LEAF});
  if(!nb)return bad();
  if((t===BENCH||t===FURN)&&!(SOLID[tile(tx,ty+1)]||tile(tx,ty+1)===PLAT))return bad();
  if(SOLID[t]&&(overlap(P,tx,ty)||enemies.some(e=>overlap(e,tx,ty))))return bad();
  setTile(tx,ty,t);const s=inv[sel];s.n--;POP[sel].x=-.25;if(!s.n)inv[sel]=null;snd.place();return true;
}
function playerAct(dt,dir){
  const s=inv[sel],it=s&&IT[s.id],cx=P.x+P.w/2,cy=P.y+P.h/2;
  const BX=Math.round(cam.x*TS),BY=Math.round(cam.y*TS);
  const mwx=(mouse.x/PS+BX)/TS,mwy=(mouse.y/PS+BY)/TS;
  mouse.tx=Math.floor(mwx);mouse.ty=Math.floor(mwy);
  P.swing=Math.max(0,P.swing-dt);placeCd-=dt;P.fire-=dt;potionCd-=dt;flash.t-=dt;
  const aimDir=mwx<cx?-1:1;
  if(mouse.l||P.swing>0||(it&&it.kind===KB&&mouse.l)){if(aimDir!==P.face)P.turn=.1;P.face=aimDir}
  else if(dir&&dir!==P.face){P.face=dir;P.turn=.1}
  P.aimA=Math.atan2(mwy-(P.y+.7),(mwx-cx)*P.face); // aim angle relative to facing
  const tx=mouse.tx,ty=mouse.ty,t=tile(tx,ty);
  let mining=false;
  if(mouse.l&&!mouse.ui&&P.dead<=0){
    if(it&&it.kind===KS){
      if(P.swing<=0){P.swingMax=[.42,.36,.31,.27,.23][it.tier];P.swing=P.swingMax;P.swingKind=1;snd.swing();P.vx+=P.face*1.5;
        for(const e of enemies){const dx=e.x+e.w/2-cx,dy=e.y+e.h/2-cy;
          if(Math.hypot(dx,dy)<2.7+e.w/2&&dx*P.face>-.4)hurtEnemy(e,DMG[it.tier]*(.85+Math.random()*.3)|0,P.face)}}
    }else if(it&&it.kind===KB){
      if(P.fire<=0){if(count(24)>0){take(24,1);P.fire=.5-.05*it.tier;P.swingMax=.25;P.swing=.25;P.swingKind=2;snd.bow();
          const sp=30,adx=mwx-cx,ady=mwy-(P.y+.6),tf=Math.hypot(adx,ady)/sp,a=Math.atan2(ady-.5*7*tf*tf,adx); // aim compensation for arrow drop
          shoot(cx,P.y+.6,Math.cos(a)*sp,Math.sin(a)*sp,Math.round(DMG[it.tier]*.8)+4,true,'arrow');kick(.6)}
        else{P.fire=.5;toast('No arrows',RAMP.copper[3]);snd.no()}}
    }else if(t>0&&REACHF(tx,ty)&&ty<H-1){
      if(mine.x!==tx||mine.y!==ty){mine.x=tx;mine.y=ty;mine.p=0}
      const pickOk=!(NEEDT[t]>0&&!(it&&it.kind===KP&&it.tier>=NEEDT[t]));
      if(!pickOk){if(mine.chip<=0){toast('Needs a better pickaxe',RAMP.copper[3]);snd.no();mine.chip=.8}mine.chip-=dt}
      else{
        mining=true;
        const m=it&&it.kind===TOOLK[t]?POW[it.tier]:.3;
        mine.p+=dt*m/HARD[t];
        if(P.swing<=0){P.swingMax=.34/Math.sqrt(Math.max(.3,m));P.swing=P.swingMax;P.swingKind=0}
        mine.chip-=dt;if(mine.chip<=0){mine.chip=.12;burst(tx+.5,ty+.5,PART_COL[t]||'#fff',2,3,.4);snd.mine()}
        if(mine.p>=1){breakTile(tx,ty);mine.x=-1;mine.p=0}
      }
    }else{mine.x=-1;mine.p=0}
  }else{mine.x=-1;mine.p=0}
  // right click: open chest, use consumable, or place
  if(mouse.r&&!mouse.ui&&P.dead<=0){
    if((t===DOOR||t===DOORO)&&REACHF(tx,ty)){
      if(mouse.rEdge){if(t===DOORO&&(overlap(P,tx,ty)||enemies.some(e=>overlap(e,tx,ty))))snd.no();else{setTile(tx,ty,t===DOOR?DOORO:DOOR);snd.place()}mouse.rEdge=false}}
    else if(t===CHEST&&REACHF(tx,ty)){if(mouse.rEdge){spillChest(tx,ty);setTile(tx,ty,CHESTO);mouse.rEdge=false}}
    else if(it&&it.use&&mouse.rEdge){
      if(it.use==='heal'){ // only healing potions share a cooldown; life crystals never do
        if(potionCd>0){toast('Potion cooldown',RAMP.copper[3]);snd.no()}
        else if(P.hp>=P.mhp){toast('Already at full health',GREY_T);snd.no()}
        else{P.hp=Math.min(P.mhp,P.hp+70);snd.heal();floatText(cx,P.y,'+70',RAMP.grass[3]);potionCd=1.5;s.n--;POP[sel].x=-.25;if(!s.n)inv[sel]=null}}
      else if(it.use==='life'){
        if(P.mhp>=200){toast('Max health reached',GREY_T);snd.no()}
        else{P.mhp+=20;P.hp+=20;snd.heal();toast('Max health +20',RAMP.grass[3]);s.n--;if(!s.n)inv[sel]=null}}
      mouse.rEdge=false;
    }else if(it&&it.tile&&placeCd<=0){tryPlace(it,tx,ty);placeCd=.12}
  }
  return mining;
}

// A humanoid is a skeleton: each limb = thigh+shin / upper+fore arm with an angle (0 = hanging straight down, + = forward).

// ---- walk cycles. Generated with two-bone IK from planted-foot trajectories, so the stance foot moves backward
// exactly as fast as the body advances (no sliding). 32 frames/cycle; the frame is chosen from distance travelled.
const WN=32,CYC={p:1.6,z:1.2,k:1.4,b:1.9}; // tiles of travel per full walk cycle
function genWalk(k,cyc,liftPx){
  const L=4.5*k,A=cyc*16/4,Dst=L*2*.978,lift=liftPx*k,out=[];
  const foot=q=>{q=((q%1)+1)%1;if(q<.5)return{x:A-4*A*q,l:0};const u=(q-.5)*2,e=u*u*(3-2*u);return{x:-A+2*A*e,l:lift*Math.sin(Math.PI*u)}};
  const ik=(x,y)=>{const D=Math.min(Math.hypot(x,y),2*L-.01),a=Math.acos(D/(2*L));return[Math.atan2(x,y)+a,2*a]};
  for(let i=0;i<WN;i++){const q=i/WN,f1=foot(q),f2=foot(q+.5),xs=q<.5?f1.x:f2.x,H=Math.sqrt(Dst*Dst-xs*xs);
    const[t1,k1]=ik(f1.x,H-f1.l),[t2,k2]=ik(f2.x,H-f2.l);
    out.push({th1:t1,kn1:k1,th2:t2,kn2:k2,arm1:-.75*f1.x/A,arm2:-.75*f2.x/A,ab1:.25+.45*Math.max(0,-f1.x/A),ab2:.25+.45*Math.max(0,-f2.x/A),hy:0,fx:[f1.x,f2.x]})}
  out.forEach((p,i)=>{const pv=out[(i+WN-3)%WN];p.hy=-Math.round((bodyShift(p,k)-bodyShift(pv,k))*.5)}); // head lags the body bob
  return out;
}

function walker(e,dt,sp,jmp,acc=30){

function trySpawn(){
  const px=P.x+P.w/2|0,under=P.y>hs[clamp(px,0,W-1)]+14,L=daylight(),night=L<.35;
  const n=t=>enemies.reduce((a,e)=>a+(e.t===t),0);
  let kind;const r=rnd();
  if(under){const dy=P.y;
    if(dy>205)kind=r<.35?'skel':r<.55?'brute':r<.8?'bat':'slime';
    else if(dy>130)kind=r<.4?'skel':r<.7?'bat':'slime';
    else kind=r<.55?'bat':r<.85?'slime':'zombie';
  }else kind=!night?'slime':r<.45?'zombie':r<.7?'eye':r<.78?'brute':'slime';
  const cap={slime:5,zombie:4,eye:2,bat:4,skel:3,brute:1};if(n(kind)>=cap[kind])return;
  if(enemies.length>8)return;
  for(let tries=0;tries<8;tries++){
    const x=Math.floor(P.x+(rnd()<.5?-1:1)*(24+rnd()*10));if(x<2||x>W-3)continue;
    if(ET[kind].fly){const y=Math.floor(P.y-6+rnd()*12);if(!hit(x,y,1,1)&&!hit(x,y-1,1,2)){spawnEnemy(kind,x,y,0);return}continue}
    for(let y=Math.max(2,Math.floor(P.y)-14),y1=y+30;y<y1&&y<H-3;y++){
      const hgt=Math.ceil(ET[kind].h);let free=true;for(let k=0;k<hgt;k++)if(solid(x,y-k)||solid(x+1,y-k))free=false;
      if(free&&solid(x,y+1)&&solid(x+1,y+1)){const e=spawnEnemy(kind,x,y+1-ET[kind].h,P.y>150?2:under?1:0);if(kind==='brute'&&!under){e.hp=e.mhp=100;e.dmg=20} /* surface night brute is weaker than the deep one */return}}
  }
}
function stepEnemies(dt){

  const L=daylight();
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
    e.flash-=dt;e.cd-=dt;e.anim+=dt;e.hurt=Math.max(0,e.hurt-dt);
    const dist=Math.hypot(e.x-P.x,e.y-P.y);
    if(dist>60||(e.t==='eye'&&L>.8&&dist>26)){enemies.splice(i,1);continue}
    if(e.stun>0)e.stun-=dt;else AI[e.t](e,dt);
    if(!e.fly)e.vy=Math.min(e.vy+54*dt,32);
    if(e.stun>0&&e.ground)e.vx=approach(e.vx,0,20*dt);
    const g0=e.ground;move(e,dt);if(e.ground&&!g0)e.sqT=.16;e.sqT=Math.max(0,e.sqT-dt);
    if(e.ground)e.dist+=Math.abs(e.vx)*dt;
    if(e.t==='zombie'&&L>.7&&e.y<hs[clamp(e.x|0,0,W-1)]+2){e.hp-=dt*6;if(rnd()<.2)burst(e.x+e.w/2,e.y,'#8f8396',1,1.5,.5,-3);if(e.hp<=0){killEnemy(e,true);continue}}
    if(P.dead<=0&&e.x<P.x+P.w&&e.x+e.w>P.x&&e.y<P.y+P.h&&e.y+e.h>P.y)hurtPlayer(e.dmg,Math.sign(P.x-e.x)||1);
  }
}

function step(dt){
  dt=Math.min(dt,1/30);
  if(hitstop>0){hitstop-=dt;dt*=.1}
  tAbs+=dt;time=(time+dt/DAY)%1;
  let dir=0;
  if(P.dead>0){P.dead-=dt;P.vx=approach(P.vx,0,20*dt);if(P.dead<=0)respawn()}
  else dir=playerStep(dt);
  playerAct(dt,dir);
  mouse.rEdge=false;
  dropsStep(dt);stepEnemies(dt);projStep(dt);partsStep(dt);ambStep(dt,daylight());
  // camera: springs give soft follow + look-ahead rubber band
  const vw=BW/TS,vh=BH/TS;
  spring(cam.look,clamp(P.vx*.16,-2,2)*(RM?0:1),dt,.5);
  spring(cam.sx,P.x+P.w/2-vw/2+cam.look.x,dt,.26);spring(cam.sy,P.y+P.h/2-vh/2+(P.vy>14?1.5:0),dt,.3);
  cam.x=clamp(cam.sx.x,0,W-vw);cam.y=clamp(cam.sy.x,0,H-vh);
  if(cam.x!==cam.sx.x){cam.sx.x=cam.x;cam.sx.v=0}if(cam.y!==cam.sy.x){cam.sy.x=cam.y;cam.sy.v=0}
  spring(shk.x,0,dt,.2);spring(shk.y,0,dt,.2);
  if(((tAbs*5)|0)!==(((tAbs-dt)*5)|0))revealMap();
  saveT-=dt;if(saveT<=0){saveT=6;save()}
}

// ===================== 20. input =====================
function setM(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.moved=true}
addEventListener('mousemove',setM);
addEventListener('mousedown',e=>{
  setM(e);audio();
  if(showTitle){showTitle=false;return}
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(over(h.x,h.y,h.w,h.h)){pressedId=h.id;mouse.ui=true;h.fn(e.button);return}}
  if(e.button===0)mouse.l=true;
  if(e.button===2){mouse.r=true;mouse.rEdge=true}
});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=false;if(e.button===2)mouse.r=false;mouse.ui=false;pressedId=''});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{
  e.preventDefault();const d=Math.sign(e.deltaY);if(!d||showTitle)return;
  if(invOpen&&CR&&over(CR.x,CR.y,CR.w,CR.h))craftScroll+=d;else{sel=(sel+d+9)%9;snd.ui()}
},{passive:false});
addEventListener('keydown',e=>{
  audio();
  if(showTitle){showTitle=false;e.preventDefault();return}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if((e.code==='Space'||e.code==='KeyW'||e.code==='ArrowUp')&&!e.repeat)P.buf=.12;
  if(e.repeat)return;
  if(/^Digit[1-9]$/.test(e.code)){sel=+e.code[5]-1;snd.ui()}
  else if(e.code==='KeyE'){invOpen=!invOpen;carry=-1;snd.ui()}
  else if(e.code==='Escape'){invOpen=false;carry=-1}
  else if(e.code==='KeyM'){mapOn=!mapOn;snd.ui()}
  else if(e.code==='KeyN'){muted=!muted;toast(muted?'Sound off':'Sound on')}
  else if(e.code==='KeyH')showTitle=true;
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.l=mouse.r=false});
addEventListener('beforeunload',save);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('resize',resize);

// ===================== 21. boot =====================
function prewarm(){ // build every character frame up front so the first enemy / first step never hitches
  for(let i=0;i<WN;i++){playerSpr('walk',i);human('z'+i,ZO,ZP[i]);human('k'+i,SO,SP[i]);human('b'+i,BO,BP[i])}
  playerSpr('idle',0);playerSpr('idle',1);['jump','fall','skid'].forEach(n=>playerSpr(n));
  for(let v=0;v<3;v++)for(let h=7;h<=17;h++)for(let ed=-1;ed<=1;ed++)slimeSpr(v,h,ed);
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(let f=0;f<2;f++)eyeSpr(a,b,f);
  for(let f=0;f<4;f++)batSpr(f);
}
prewarm();
let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(Math.max((now-lastT)/1000,0),1/30);lastT=now;
  if(!showTitle)step(dt);else tAbs+=dt;
  draw();drawUI(dt);
}
resize();
const boot=loadSave();newGame(boot?boot.seed:(Math.random()*2e9)|0||1,boot);
requestAnimationFrame(t=>{lastT=t;frame(t)});
</script>
